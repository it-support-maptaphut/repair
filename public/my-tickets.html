<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06c755">
<title>ประวัติการแจ้งซ่อม</title>
<link rel="icon" type="image/jpeg" href="Favorite%20Icon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ticket.css">
<link rel="stylesheet" href="my-tickets.css">
<script src="splash.js" defer></script>
</head>
<body class="ticket-page app-nav my-page">

<div id="splash" class="splash" aria-hidden="true">
  <div class="splash-logo"><img src="logo-ticket/logo-wan.jpg" alt=""></div>
  <div class="splash-title">ระบบแจ้งซ่อม IT</div>
  <div class="splash-sub">กำลังโหลดระบบ โปรดรอสักครู่...</div>
  <div class="splash-bar"><div class="splash-bar-fill"></div></div>
</div>

<nav class="navbar" id="topNav">
  <div class="navbar-inner">
    <a class="navbar-brand" href="ticket.html">
      <img class="navbar-logo navbar-logo-img" src="logo-ticket/logo-wan.jpg" alt="โลโก้ระบบแจ้งซ่อม IT">
      <span class="navbar-title">ระบบแจ้งซ่อม IT</span>
    </a>
    <div id="visitorBar" class="visitor-bar hidden" role="status">
      <span id="visitorBarText"></span>
    </div>
    <div class="navbar-links">
      <a class="nav-link" href="ticket.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        <span>แจ้งซ่อม</span>
      </a>
      <a class="nav-link is-active" href="my-tickets.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>ประวัติ</span>
      </a>
      <a class="nav-link" href="contact.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.6 2.81.72A2 2 0 0 1 22 16.92z"/></svg>
        <span>ติดต่อ</span>
      </a>
    </div>
  </div>
</nav>

<div id="verifyGate" class="verify-gate hidden" role="dialog" aria-modal="true" aria-labelledby="verifyTitle">
  <div class="verify-box">
    <div class="verify-head">
      <div class="verify-logo">
        <img class="verify-logo-img" src="logo-ticket/logo-wan.jpg" alt="โลโก้ระบบแจ้งซ่อม IT">
      </div>
      <h2 id="verifyTitle" class="verify-title">ยืนยันตัวตน</h2>
      <p class="verify-sub">เพื่อดูประวัติการแจ้งซ่อมของคุณ<br>ระบบจะจำไว้เพื่อความปลอดภัย</p>
    </div>

    <div class="verify-fields">
      <label for="verifyName" class="verify-label">ชื่อ</label>
      <input type="text" id="verifyName" class="verify-input" maxlength="60" autocomplete="given-name">

      <label for="verifyPosition" class="verify-label">ตำแหน่ง</label>
      <input type="text" id="verifyPosition" class="verify-input" maxlength="120" autocomplete="organization-title">
    </div>

    <button id="verifySubmit" class="verify-btn" type="button">เข้าใช้งานระบบ</button>
    <p id="verifyErr" class="verify-err hidden"></p>
  </div>
</div>

<header class="my-head">
  <h1 class="my-title">ประวัติการแจ้งซ่อม</h1>
</header>

<main class="my-wrap" id="myWrap">
  <div class="my-tickets">
    <div id="myList" class="my-list"></div>
  </div>

  <button id="newTicketBtn" class="mt-new-btn hidden" type="button" onclick="location.href='ticket.html'">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    แจ้งซ่อมใหม่
  </button>
</main>

<div id="loadingOverlay" class="overlay hidden">
  <div class="spinner"></div>
  <p class="overlay-msg" id="loadingMsg">กำลังโหลดประวัติ...</p>
</div>

<div id="toast" class="toast hidden"></div>

<script src="notify.js"></script>
<script src="settings.js"></script>
<script src="touch-fx.js" data-fx="zoom"></script>
<script src="my-tickets.js"></script>
</body>
</html>
