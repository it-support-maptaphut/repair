<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00b26a">
  <title>ติดต่อฝ่าย IT SUPPORT</title>
  <link rel="icon" type="image/png" href="Favorite%20Icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      font-family: "Prompt", "Sarabun", system-ui, -apple-system, sans-serif;
      background: #f4f7f5;
      color: #12261b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-tap-highlight-color: transparent;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border: 1px solid #e6ece8;
      border-radius: 18px;
      box-shadow: 0 18px 48px rgba(9, 43, 26, .10);
      padding: 30px 24px 32px;
      text-align: center;
    }

    .logo img { height: 68px; width: auto; display: block; margin: 0 auto 14px; }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: #0e6b3a;
    }

    .sub {
      margin: 6px 0 22px;
      font-size: 14px;
      color: #6b7c72;
    }

    .phone {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-decoration: none;
      background: #00b26a;
      color: #fff;
      border-radius: 14px;
      padding: 14px 18px;
      transition: background .15s ease, transform .15s ease;
    }

    .phone:hover { background: #009a5c; transform: translateY(-1px); }
    .phone:active { transform: translateY(0); }

    .phone svg { width: 24px; height: 24px; flex: 0 0 auto; }

    .phone-text { display: flex; flex-direction: column; line-height: 1.25; text-align: left; }
    .phone-text strong { font-size: 20px; font-weight: 700; letter-spacing: .3px; }
    .phone-text small { font-size: 12px; opacity: .85; }

    .qr { margin-top: 24px; }

    .qr img {
      width: 220px;
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      border: 1px solid #e6ece8;
      border-radius: 14px;
      background: #fff;
      padding: 10px;
    }

    .qr p {
      margin: 12px 0 0;
      font-size: 14px;
      color: #6b7c72;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo"><img src="logo-ticket/logo-wan.png" alt=""></div>
    <h1>ติดต่อฝ่าย IT SUPPORT</h1>
    <p class="sub">แจ้งปัญหาหรือสอบถามทีมไอที</p>

    <a class="phone" href="tel:0630050430">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.6 2.81.72A2 2 0 0 1 22 16.92z" />
      </svg>
      <span class="phone-text">
        <strong>063-005-0430</strong>
        <small>โทรติดต่อ</small>
      </span>
    </a>

    <div class="qr">
      <img src="logo-ms/my-qr/image.png" alt="QR Code ติดต่อ IT SUPPORT">
      <p>สแกน QR Code เพื่อติดต่อ</p>
    </div>
  </main>
</body>

</html>
