<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06281d">
  <title>IT SUPPORT</title>
  <link rel="icon" type="image/png" href="Favorite%20Icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      font-family: "Prompt", "Sarabun", system-ui, -apple-system, sans-serif;
      color: #fff;
      background:
        radial-gradient(1200px 800px at 12% -12%, rgba(0, 210, 130, .20), rgba(0, 210, 130, 0) 60%),
        radial-gradient(1000px 760px at 100% 112%, rgba(0, 150, 96, .18), rgba(0, 150, 96, 0) 55%),
        linear-gradient(160deg, #06281d 0%, #0a3a29 55%, #04170f 100%);
      background-attachment: fixed;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---------------- Header ---------------- */
    .hdr {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 24px 44px;
    }

    .hdr-logo { height: 40px; width: auto; display: block; }

    .hdr-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .92);
    }

    .hdr-right {
      margin-left: auto;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .4);
    }

    /* ---------------- Stage ---------------- */
    .stage {
      flex: 1;
      width: 100%;
      max-width: 1480px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 26px;
      padding: 10px 44px 44px;
    }

    .svc {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 340px;
      padding: 46px 44px;
      border-radius: 24px;
      background: rgba(255, 255, 255, .055);
      border: 1px solid rgba(255, 255, 255, .12);
      color: #fff;
      font: inherit;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
      overflow: hidden;
      transition: transform .22s ease, background .22s ease, border-color .22s ease, box-shadow .22s ease;
    }

    .svc:hover {
      transform: translateY(-4px);
      background: rgba(255, 255, 255, .09);
      border-color: rgba(0, 220, 140, .5);
      box-shadow: 0 34px 64px rgba(0, 0, 0, .38);
    }

    .svc:focus-visible { outline: 2px solid rgba(0, 220, 140, .8); outline-offset: 3px; }

    .svc-ico {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      border-radius: 20px;
      background: rgba(0, 220, 140, .13);
      border: 1px solid rgba(0, 220, 140, .3);
      color: #3ae6a6;
    }

    .svc-ico svg { width: 38px; height: 38px; }

    .svc-en {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(58, 230, 166, .85);
    }

    .svc-title {
      margin-top: 10px;
      font-size: clamp(24px, 2.4vw, 34px);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: .2px;
    }

    .svc-go {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 22px;
      font-size: 14px;
      font-weight: 600;
      color: rgba(255, 255, 255, .6);
      transition: color .2s ease, gap .2s ease;
    }

    .svc:hover .svc-go { color: #fff; gap: 16px; }

    .svc-go svg { width: 18px; height: 18px; }

    /* ---------------- Footer ---------------- */
    .ftr {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 44px 26px;
      font-size: 11.5px;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, .35);
    }

    .ftr .clock { margin-left: auto; font-variant-numeric: tabular-nums; }

    /* ---------------- Modal ---------------- */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(2, 12, 8, .74);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    .modal[hidden] { display: none; }

    .modal-card {
      position: relative;
      width: min(410px, 100%);
      padding: 34px 30px 28px;
      border-radius: 24px;
      background: #fff;
      color: #10261a;
      text-align: center;
      box-shadow: 0 44px 96px rgba(0, 0, 0, .5);
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: #f1f5f2;
      color: #46584d;
      font-size: 21px;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .modal-close:hover { background: #e6ece8; }

    .m-en {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #0c7a44;
    }

    .m-title {
      margin: 8px 0 0;
      font-size: 22px;
      font-weight: 800;
      color: #12301f;
    }

    .m-phone {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      margin: 20px 0 4px;
      text-decoration: none;
      color: #0e6b3a;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .m-phone svg { width: 24px; height: 24px; }

    .m-divider {
      height: 1px;
      margin: 22px 0 4px;
      background: #e6ece8;
    }

    .m-qr {
      width: 210px;
      max-width: 72%;
      height: auto;
      display: block;
      margin: 18px auto 0;
      padding: 10px;
      border: 1px solid #e6ece8;
      border-radius: 16px;
      background: #fff;
    }

    .m-caption {
      margin: 14px 0 0;
      font-size: 12.5px;
      color: #7a8a80;
    }

    /* ---------------- Responsive ---------------- */
    @media (max-width: 880px) {
      .hdr { padding: 20px 22px; }
      .hdr-right { display: none; }
      .stage { grid-template-columns: 1fr; gap: 16px; padding: 6px 22px 30px; }
      .svc { min-height: 0; padding: 30px 26px; }
      .svc-ico { width: 60px; height: 60px; border-radius: 17px; }
      .svc-ico svg { width: 30px; height: 30px; }
      .ftr { padding: 0 22px 20px; }
    }

    @media (max-width: 560px) {
      .svc-title { font-size: 22px; }
      .stage { padding: 4px 14px 24px; }
      .hdr { padding: 16px 14px; }
      .ftr { padding: 0 14px 16px; }
    }
  </style>
</head>

<body>

  <header class="hdr">
    <img class="hdr-logo" src="logo-ticket/logo-wan.png" alt="">
    <span class="hdr-name">IT&nbsp;SUPPORT</span>
    <span class="hdr-right">System v1.0.2</span>
  </header>

  <main class="stage">

    <button type="button" class="svc" id="contactTile">
      <span class="svc-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.6 2.81.72A2 2 0 0 1 22 16.92z" />
        </svg>
      </span>
      <span>
        <span class="svc-en">Contact</span>
        <span class="svc-title">ติดต่อด่วน</span>
      </span>
      <span class="svc-go">
        เบอร์โทรและ QR Code
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
      </span>
    </button>

    <a class="svc" href="ticket.html">
      <span class="svc-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
        </svg>
      </span>
      <span>
        <span class="svc-en">Service Request</span>
        <span class="svc-title">แจ้งซ่อม / เช็กความคืบหน้า</span>
      </span>
      <span class="svc-go">
        เข้าสู่ระบบ
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
      </span>
    </a>

  </main>

  <footer class="ftr">
    <span>IT SUPPORT</span>
    <span class="clock" id="clock">--:--</span>
  </footer>

  <div class="modal" id="contactModal" hidden>
    <div class="modal-card">
      <button type="button" class="modal-close" id="modalClose" aria-label="ปิด">&times;</button>
      <div class="m-en">Contact</div>
      <h2 class="m-title">ติดต่อด่วน</h2>
      <a class="m-phone" href="tel:0630050430">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.6 2.81.72A2 2 0 0 1 22 16.92z" /></svg>
        063-005-0430
      </a>
      <div class="m-divider"></div>
      <img class="m-qr" src="logo-ms/my-qr/image.png" alt="QR Code ติดต่อ IT SUPPORT">
      <p class="m-caption">สแกน QR Code เพื่อติดต่อฝ่ายไอที</p>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      function pad(n) { return n < 10 ? "0" + n : "" + n; }

      function tick() {
        var d = new Date();
        var el = document.getElementById("clock");
        if (el) el.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
      }
      tick();
      setInterval(tick, 15000);

      var modal = document.getElementById("contactModal");
      var openBtn = document.getElementById("contactTile");
      var closeBtn = document.getElementById("modalClose");

      function open() { if (modal) modal.hidden = false; }
      function close() { if (modal) modal.hidden = true; }

      if (openBtn && modal) {
        openBtn.addEventListener("click", open);
        modal.addEventListener("click", function (e) { if (e.target === modal) close(); });
        if (closeBtn) closeBtn.addEventListener("click", close);
        document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
      }
    })();
  </script>
</body>

</html>
