<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00b26a">
  <title>IT SUPPORT — ติดต่อฝ่ายไอที</title>
  <link rel="icon" type="image/png" href="Favorite%20Icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100%;
      font-family: "Prompt", "Sarabun", system-ui, -apple-system, sans-serif;
      color: #12261b;
      background:
        radial-gradient(1000px 420px at 85% -8%, #d9f7e8 0%, rgba(217, 247, 232, 0) 60%),
        radial-gradient(900px 420px at 0% 8%, #e7f1ff 0%, rgba(231, 241, 255, 0) 55%),
        #f4f7f5;
      -webkit-tap-highlight-color: transparent;
    }

    .page { max-width: 460px; margin: 0 auto; padding: 18px 16px 34px; }

    /* ---------- Hero ---------- */
    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      padding: 30px 22px 26px;
      text-align: center;
      color: #fff;
      background: linear-gradient(140deg, #00b26a 0%, #029b63 55%, #0e6b3a 100%);
      box-shadow: 0 20px 46px rgba(10, 90, 54, .28);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: -40% -30% auto auto;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .14);
    }

    .hero-logo {
      position: relative;
      height: 74px;
      width: auto;
      display: block;
      margin: 0 auto 12px;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .22));
    }

    .hero h1 {
      position: relative;
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: .6px;
    }

    .hero p {
      position: relative;
      margin: 8px 0 0;
      font-size: 14px;
      line-height: 1.5;
      color: rgba(255, 255, 255, .92);
    }

    .hero-badge {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 16px;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .18);
      border: 1px solid rgba(255, 255, 255, .32);
      font-size: 12.5px;
      font-weight: 600;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #b9ffcf;
      box-shadow: 0 0 0 4px rgba(185, 255, 207, .28);
    }

    /* ---------- Cards ---------- */
    .card {
      background: #fff;
      border: 1px solid #e6ece8;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(9, 43, 26, .07);
      padding: 20px 18px;
      margin-top: 16px;
    }

    .card-title {
      margin: 0 0 14px;
      font-size: 15px;
      font-weight: 700;
      color: #0e6b3a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title::before {
      content: "";
      width: 4px;
      height: 16px;
      border-radius: 3px;
      background: #00b26a;
    }

    /* ---------- Buttons ---------- */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 15px 18px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      transition: transform .14s ease, background .15s ease, box-shadow .15s ease;
    }

    .btn + .btn { margin-top: 12px; }

    .btn svg { width: 24px; height: 24px; flex: 0 0 auto; }

    .btn-call {
      color: #fff;
      background: linear-gradient(135deg, #00c274, #009a5c);
      box-shadow: 0 10px 22px rgba(0, 178, 106, .32);
    }

    .btn-call:hover { transform: translateY(-1px); box-shadow: 0 14px 26px rgba(0, 178, 106, .4); }

    .btn-text { display: flex; flex-direction: column; line-height: 1.2; text-align: left; }
    .btn-text strong { font-size: 17px; font-weight: 700; }
    .btn-text small { font-size: 11.5px; font-weight: 500; opacity: .8; }

    /* ---------- QR ---------- */
    .qr-wrap { text-align: center; }

    .qr-wrap img {
      width: 216px;
      max-width: 78%;
      height: auto;
      display: block;
      margin: 4px auto 0;
      border: 1px solid #e6ece8;
      border-radius: 16px;
      background: #fff;
      padding: 10px;
    }

    .qr-wrap p { margin: 12px 0 0; font-size: 13.5px; color: #6b7c72; }

    .note {
      margin: 18px 4px 0;
      font-size: 12.5px;
      line-height: 1.6;
      color: #7a8a80;
      text-align: center;
    }

    .foot {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      color: #94a39a;
    }

    @media (max-width: 380px) {
      .hero h1 { font-size: 21px; }
      .hero-logo { height: 64px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="hero">
      <img class="hero-logo" src="logo-ticket/logo-wan.png" alt="">
      <h1>IT SUPPORT</h1>
      <p>ศูนย์ช่วยเหลือด้านไอที<br>แจ้งปัญหา ติดต่อสอบถามเรื่องอุปกรณ์และระบบ</p>
      <span class="hero-badge"><span class="dot"></span> พร้อมให้บริการ</span>
    </header>

    <main>
      <section class="card">
        <h2 class="card-title">ติดต่อฝ่ายไอที</h2>

        <a class="btn btn-call" href="tel:0630050430">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.6 2.81.72A2 2 0 0 1 22 16.92z" />
          </svg>
          <span class="btn-text">
            <strong>063-005-0430</strong>
            <small>โทรติดต่อฝ่ายไอที</small>
          </span>
        </a>
      </section>

      <section class="card qr-wrap">
        <h2 class="card-title">สแกน QR Code</h2>
        <img src="logo-ms/my-qr/image.png" alt="QR Code ติดต่อ IT SUPPORT">
        <p>สแกนด้วยกล้องมือถือเพื่อติดต่อฝ่ายไอที</p>
      </section>

      <p class="note">* หากแจ้งซ่อมผ่านระบบแล้ว ทีม IT จะติดต่อกลับโดยเร็ว</p>
      <p class="foot">ฝ่ายไอที — ระบบแจ้งปัญหา/แจ้งซ่อมอุปกรณ์ไอที</p>
    </main>
  </div>
</body>

</html>
