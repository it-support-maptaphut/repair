<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="no-zoom.js"></script>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b7a43">
<title>เข้าสู่ระบบ — Admin IT</title>
<link rel="icon" type="image/png" href="Favorite%20Icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ticket.css">
<script src="splash.js" defer></script>
<script src="loader.js"></script>
<!-- บล็อกเบราว์เซอร์สำรอง/เติมรหัสผ่านอัตโนมัติ -->
<script src="no-save.js" defer></script>
<style>
  /* หน้า login เต็มจอทุกขนาด (safe-area + รองรับ iPhone แบบมีตัดหู) */
  html, body { height: 100%; }
  body.ticket-page.admin-login-page {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: stretch;
    justify-content: center;
    padding: 0;
    overflow-y: auto;
  }
  .admin-login-wrap {
    width: 100%;
    max-width: none;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .admin-login-box {
    width: 100%;
    max-width: 410px;
    background: var(--tk-card);
    border: 1px solid var(--tk-line);
    border-radius: var(--tk-radius);
    box-shadow: var(--tk-shadow);
    padding: 30px 26px 26px;
    animation: ticketPop 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .admin-login-title { margin: 0 0 6px; font-size: 20px; color: var(--tk-ink); font-weight: 700; text-align: center; }
  .admin-login-sub { margin: 0 0 24px; font-size: 13.5px; line-height: 1.6; color: var(--tk-muted); text-align: center; }
  .admin-login-field { margin-bottom: 16px; }
  .admin-login-field label { display: block; font-size: 13.5px; font-weight: 700; color: var(--tk-ink); margin: 0 0 7px; }
  .admin-login-field .verify-input { margin-bottom: 0; }

  /* ---------- ช่อง user / password กว้างเต็มกล่องพอดี ---------- */
  .admin-login-page .admin-login-field input[type="text"],
  .admin-login-page .admin-login-field input[type="password"] {
    display: block;
    width: 100% !important;
    max-width: 100%;
    height: 38px;
    margin: 0;
  }

  /* ---------- เอฟเฟคพิกเซล 3 มิติ: ยกขึ้นเมื่อชี้เมาส์ ---------- */
  .admin-login-page .admin-login-box .admin-login-title,
  .admin-login-page .admin-login-box .admin-login-sub,
  .admin-login-page .admin-login-box .admin-login-err,
  .admin-login-page .admin-login-box .admin-login-field label,
  .admin-login-page .admin-login-box .admin-login-field input,
  .admin-login-page .admin-login-box .admin-login-btn {
    position: relative;
    transition:
      transform 0.07s linear !important,
      box-shadow 0.07s linear !important,
      filter 0.1s linear !important;
    will-change: transform;
  }
  /* ทุกชิ้น: ยกขึ้น 1px เมื่อชี้เมาส์ */
  .admin-login-page .admin-login-box .admin-login-title:hover,
  .admin-login-page .admin-login-box .admin-login-sub:hover,
  .admin-login-page .admin-login-box .admin-login-err:not(.hidden):hover,
  .admin-login-page .admin-login-box .admin-login-field label:hover,
  .admin-login-page .admin-login-box .admin-login-field input:hover,
  .admin-login-page .admin-login-box .admin-login-btn:hover {
    transform: translate(-1px, -1px);
  }
  /* ชิ้นที่เป็นวัตถุ (ช่องกรอก / ปุ่ม): เพิ่มเงาพิกเซลด้านขวาล่าง */
  .admin-login-page .admin-login-box .admin-login-field input:hover,
  .admin-login-page .admin-login-box .admin-login-btn:hover {
    box-shadow: 3px 3px 0 0 rgba(0, 0, 0, 0.42) !important;
  }
  /* ข้อความ / ป้าย: เข้มขึ้นเล็กน้อยตอนชี้ (ไม่ใส่เงาทับตัวอักษร) */
  .admin-login-page .admin-login-box .admin-login-title:hover,
  .admin-login-page .admin-login-box .admin-login-sub:hover,
  .admin-login-page .admin-login-box .admin-login-err:not(.hidden):hover,
  .admin-login-page .admin-login-box .admin-login-field label:hover {
    filter: brightness(0.72);
  }
  /* ช่องกรอก: ขอบเข้มขึ้น + พื้นอ่อนลง ให้เหมือนวัตถุ 3 มิติ */
  .admin-login-page .admin-login-box .admin-login-field input:hover {
    border-color: #6b6b6b #e9e9e9 #e9e9e9 #6b6b6b !important;
    background: #f2f2f2 !important;
  }
  /* ปุ่ม: กดลงแบบพิกเซล */
  .admin-login-page .admin-login-box .admin-login-btn:hover {
    transform: translate(-1px, -1px);
    border-color: #fff #404040 #404040 #fff !important;
  }
  .admin-login-page .admin-login-box .admin-login-btn:active {
    transform: translate(1px, 1px);
    box-shadow: 0 0 0 0 rgba(0, 0, 0, 0) !important;
  }
  .admin-login-err { margin: 0 0 12px; font-size: 13px; color: #d4382f; text-align: center; }
  .admin-login-btn {
    width: 100%;
    margin-top: 6px;
    padding: 15px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(180deg, var(--tk-accent), var(--tk-green));
    color: #fff;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(11, 122, 67, 0.34);
    transition: transform 0.12s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    will-change: transform;
  }
  .admin-login-btn:hover { box-shadow: 0 10px 26px rgba(11, 122, 67, 0.42); }
  .admin-login-btn:active { transform: scale(0.98); }
  .admin-login-btn:disabled { opacity: 0.65; cursor: default; }

  /* ---------- แสงวงกลมตามเมาส์ (ชี้อะไร อะไรนั้นเด่น) ---------- */
  /* ไม่คลุมดำทั้งจอ — จอสว่างตามปกติเสมอ มีแต่วงแสงวงกลมติดเมาส์ */
  .lg-glow {
    --lg-r: 96px;
    position: fixed;
    top: 0;
    left: 0;
    width: var(--lg-r);
    height: var(--lg-r);
    margin: calc(var(--lg-r) / -2) 0 0 calc(var(--lg-r) / -2);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9991;
    opacity: 0;
    transition: opacity .25s ease;
    background: radial-gradient(
      circle,
      rgba(255, 255, 255, .10) 0%,
      rgba(255, 255, 255, .05) 54%,
      rgba(255, 255, 255, .17) 77%,
      rgba(255, 255, 255, .32) 91%,
      rgba(255, 255, 255, 0) 100%
    );
  }
  .lg-glow.is-on { opacity: 1; }
  /* วงแหวนเรืองแสงบางๆ รอบวงกลม */
  .lg-glow::after {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .5);
    box-shadow:
      0 0 14px rgba(255, 255, 255, .32),
      inset 0 0 18px rgba(255, 255, 255, .18);
  }
  /* จอเล็ก: ย่อวงกลมให้ใกล้จุดชี้มากขึ้น */
  @media (max-width: 520px) {
    .lg-glow { --lg-r: 78px; }
  }
  /* อุปกรณ์ที่ไม่มีเมาส์ (มือถือ/แท็บเล็ต) → ไม่แสดงแสง */
  @media (hover: none) {
    .lg-glow { display: none !important; }
  }

  /* ---------- บล็อกเบราว์เซอร์สำรอง/เติมรหัสผ่านอัตโนมัติ ---------- */
  /* ฟอร์มหลอก: ย่อไว้ใกล้มุมจอ ให้เบราว์เซอร์จับคู่ช่องนี้แทนช่องจริง */
  .lg-decoy {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 1px;
    height: 1px;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    z-index: -1;
  }
  .lg-decoy input { width: 1px; height: 1px; padding: 0; border: 0; }

  /* มือถือ: ให้กล่อง login เต็มจอ 100% */
  @media (max-width: 520px) {
    .admin-login-wrap { padding: 0; align-items: stretch; }
    .admin-login-box {
      max-width: none;
      min-height: 100vh;
      min-height: 100dvh;
      border: none;
      border-radius: 0;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: calc(28px + env(safe-area-inset-top, 0px)) 22px calc(28px + env(safe-area-inset-bottom, 0px));
    }
  }
  </style>
<!-- ธีมระบบ: 90S (กำหนดเป็นธีมหลักของระบบ) -->
  <link rel="stylesheet" href="admin-retro.css">
  </head>
<body class="ticket-page admin-login-page">

<div id="splash" class="splash" aria-hidden="true">
  <div class="splash-logo"><img src="logo-ticket/logo-wan.png" alt=""></div>
  <div class="splash-title">ระบบแจ้งซ่อม IT</div>
  <div class="splash-sub">กำลังโหลดระบบ โปรดรอสักครู่...</div>
  <div class="splash-bar"><div class="splash-bar-fill"></div></div>
</div>

<!-- แสงวงกลมตามเมาส์: ชี้อะไร อะไรนั้นเด่น -->
<div class="lg-glow" id="lgGlow" aria-hidden="true"></div>

<!-- ฟอร์มหลอก: ให้เบราว์เซอร์ "สำรอง/เติมรหัสผ่านอัตโนมัติ" ไปที่ช่องนี้แทนช่องจริง -->
<form class="lg-decoy" data-nosave-decoy aria-hidden="true" autocomplete="off">
  <input type="text" name="lg_dc_user" tabindex="-1" autocomplete="off">
  <input type="password" name="lg_dc_pass" tabindex="-1" autocomplete="off">
</form>

<div class="admin-login-wrap">
  <div class="admin-login-box">
    <h1 class="admin-login-title">เข้าสู่ระบบ</h1>
    <p class="admin-login-sub">ยืนยันตัวตนสำหรับผู้ดูแลระบบก่อนเข้าใช้งาน</p>

    <p id="loginErr" class="admin-login-err hidden" role="alert"></p>

    <form id="loginForm" autocomplete="off" novalidate>
    <div class="admin-login-field">
      <label for="loginUser">ชื่อผู้ใช้</label>
      <input type="text" id="loginUser" class="verify-input" maxlength="60"
             autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"
             data-lpignore="true" data-1p-ignore="true" data-bwignore="true" data-form-type="other">
    </div>

    <div class="admin-login-field">
      <label for="loginPass">รหัสผ่าน</label>
      <input type="password" id="loginPass" class="verify-input" maxlength="120"
             autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"
             data-lpignore="true" data-1p-ignore="true" data-bwignore="true" data-form-type="other">
    </div>

    <button id="loginBtn" class="admin-login-btn" type="button">เข้าสู่ระบบ</button>
    </form>
  </div>
</div>

<script>
(function () {
  var errEl = document.getElementById("loginErr");
  var userEl = document.getElementById("loginUser");
  var passEl = document.getElementById("loginPass");
  var btn = document.getElementById("loginBtn");
  var busy = false;

  function fail(msg) {
    errEl.textContent = msg;
    errEl.classList.remove("hidden");
  }

  function clearErr() {
    errEl.classList.add("hidden");
  }

  function submit() {
    if (busy) return;
    var user = userEl.value.trim();
    var pass = passEl.value;
    if (!user || !pass) { fail("กรอกชื่อผู้ใช้และรหัสผ่าน"); return; }
    clearErr();
    busy = true;
    btn.disabled = true;
    btn.textContent = "กำลังเข้าสู่ระบบ...";

    function postLogin(route, body) {
      return fetch(route, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      }).then(function (r) {
        return r.json().then(function (d) { return { status: r.status, d: d }; });
      });
    }

    postLogin("/api/auth/login", { user: user, pass: pass })
      .then(function (adminRes) {
        if (adminRes.status < 400) return null; // admin สำเร็จ
        return postLogin("/api/auth/user-login", { username: user, password: pass });
      })
      .then(function (userRes) {
        if (userRes === null) {
          window.location.href = "/admin.html";
          return;
        }
        if (userRes.status < 400) {
          window.location.href = "/admin.html";
          return;
        }
        busy = false;
        btn.disabled = false;
        btn.textContent = "เข้าสู่ระบบ";
        fail((userRes.d && userRes.d.message) || "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง");
        passEl.select();
      })
      .catch(function () {
        busy = false;
        btn.disabled = false;
        btn.textContent = "เข้าสู่ระบบ";
        fail("เครือข่ายขัดข้อง กรุณาลองใหม่");
      });
  }

  btn.addEventListener("click", submit);
  passEl.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); submit(); } });

  userEl.addEventListener("input", clearErr);
  passEl.addEventListener("input", clearErr);

  // ผู้ที่ Authed อยู่แล้ว (admin หรือ พนักงาน) → เข้าไปได้เลย
  fetch("/api/auth/me")
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.ok && d.authed) return window.location.replace("/admin.html");
      return fetch("/api/auth/user-me").then(function (r) { return r.json(); });
    })
    .then(function (ud) {
      if (ud && ud.ok && ud.authed) window.location.replace("/admin.html");
    })
    .catch(function () {});

  setTimeout(function () { userEl.focus(); }, 60);

  // ---------- แสงวงกลมตามเมาส์ ----------
  (function () {
    var glow = document.getElementById("lgGlow");
    if (!glow) return;
    if (!window.matchMedia || !window.matchMedia("(hover: hover)").matches) return;

    var tx = window.innerWidth / 2;
    var ty = window.innerHeight / 2;
    var cx = tx;
    var cy = ty;
    var press = 0;
    var on = false;
    var raf = 0;

    function paint() {
      var s = press ? 1.18 : 1;
      glow.style.transform = "translate3d(" + cx + "px," + cy + "px,0) scale(" + s + ")";
    }

    function loop() {
      cx += (tx - cx) * 0.28;
      cy += (ty - cy) * 0.28;
      paint();
      if (Math.abs(tx - cx) > 0.4 || Math.abs(ty - cy) > 0.4) {
        raf = requestAnimationFrame(loop);
      } else {
        raf = 0;
      }
    }

    function kick() {
      if (!raf) raf = requestAnimationFrame(loop);
    }

    function show() {
      if (on) return;
      on = true;
      glow.classList.add("is-on");
    }

    function hide() {
      on = false;
      glow.classList.remove("is-on");
    }

    window.addEventListener("mousemove", function (e) {
      tx = e.clientX;
      ty = e.clientY;
      show();
      kick();
    }, { passive: true });

    window.addEventListener("mouseenter", show);
    document.addEventListener("mouseleave", hide);
    window.addEventListener("blur", hide);

    // ขยายวงกลมเล็กน้อยตอนกด (คล้ายแสงสะท้อน)
    window.addEventListener("mousedown", function () { press = 1; paint(); }, { passive: true });
    window.addEventListener("mouseup", function () { press = 0; paint(); }, { passive: true });

    // จัดพอกตำแหน่งเริ่มต้นไว้กลางจอ ไม่ให้แสงกระพริบตอนเข้าเว็บ
    paint();
  })();
})();
</script>
</body>
</html>
