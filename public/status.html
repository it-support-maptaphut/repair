<main class="status-wrap" id="statusWrap">

  <div class="search-col">
    <section class="status-card">
      <label class="field-label" for="statusNo">หมายเลขแจ้งซ่อม</label>
      <p class="field-hint">ใส่รหัสที่ได้รับหลังแจ้งซ่อม เช่น HW-00X หรือ SW-0XX</p>
      <div class="search-row">
        <input type="text" id="statusNo" class="text-input" inputmode="text" maxlength="12" placeholder="เช่น HW-001" autocomplete="off">
        <button id="statusBtn" class="action-btn primary" type="button">ตรวจสอบ</button>
      </div>
    </section>
  </div>

  <div class="result-col">
    <div id="myTickets" class="my-tickets hidden">
      <h2 class="sub-heading">งานของคุณ</h2>
      <div id="myList"></div>
    </div>

    <div id="result" class="result"></div>
  </div>

</main>

<div id="toast" class="toast hidden"></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="notify.js"></script>
<script src="status.js"></script>
<script>
function toggleTicketNav(event) {
  if (event && event.stopPropagation) event.stopPropagation();
  document.getElementById("topNav").classList.toggle("is-open");
}
function closeTicketNav() {
  document.getElementById("topNav").classList.remove("is-open");
}
document.addEventListener("click", function (e) {
  var nav = document.getElementById("topNav");
  if (nav && !nav.contains(e.target)) closeTicketNav();
});
</script>
</body>
